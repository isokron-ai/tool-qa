on: issues
permissions: {}
jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: inline
        run: echo "${{ github.event.issue.title }}"
      - name: block
        run: |
          echo start
          echo "${{github.event.issue.body}}"
      - name: inside a function
        run: echo "${{ toJSON(github['event']) }}"
