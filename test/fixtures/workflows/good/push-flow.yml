'on': [push, pull_request]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - {uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1", with: {node-version: "${{ matrix.node }}"}}
      - run: node --test
