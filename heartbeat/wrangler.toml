# Deploy: see heartbeat/README.md. No routes: the Worker only runs on its cron trigger.
name = "isokron-loop-heartbeat"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
HEARTBEAT_ENABLED = "true"
# The report step (v1/heartbeat.json). Off until the owner turns it on; see README.
REPORT_ENABLED = "false"

[[r2_buckets]]
binding = "LIVE"
bucket_name = "isokron-loop-live"

[observability]
enabled = true
