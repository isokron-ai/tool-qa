name: history-popularity

on:
  schedule:
    - cron: '11 5 * * 1' # weekly: downloads and stars
    - cron: '11 5 * * 0,2-6' # other days: stars only
  workflow_dispatch:
    inputs:
      mode:
        description: 'downloads, stars or all'
        type: choice
        options: [all, downloads, stars]
        default: all

permissions: {}

concurrency:
  group: history-popularity
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # download the newest crates subset from history-packages
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_HISTORY_POPULARITY_ENABLED: ${{ vars.LANE_HISTORY_POPULARITY_ENABLED }}
        run: node scripts/guard.mjs --job history-popularity --no-slots
      - name: Pick mode
        id: mode
        if: steps.guard.outputs.proceed == 'true'
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "${INPUT_MODE}" ]; then mode="${INPUT_MODE}"
          elif [ "${EVENT_SCHEDULE}" = "11 5 * * 1" ]; then mode=all
          else mode=stars; fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          node-version: '22'
      - name: Restore ETag cache
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/popularity
          key: h3-state-none
          restore-keys: h3-state-
      - name: Unit tests
        if: steps.guard.outputs.proceed == 'true'
        run: node --test 'history/popularity/test/*.test.mjs'
      - name: Fetch crates subset
        id: crates
        if: steps.guard.outputs.proceed == 'true' && steps.mode.outputs.mode != 'stars'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # crates counts come from the H2 dump subset, written by history-packages on days the dump changed.
          # Take the newest crates-*.ndjson.gz from its last 10 successful runs. None found = a warning; crates are skipped.
          mkdir -p .crates
          for id in $(gh run list -R "${REPO}" -w history-packages -s success -L 10 --json databaseId -q '.[].databaseId'); do
            rm -rf .crates/dl
            gh run download "${id}" -R "${REPO}" -n "history-packages-${id}" -D .crates/dl 2>/dev/null || continue
            f=$(find .crates/dl -name 'crates-*.ndjson.gz' | sort | tail -n 1)
            if [ -n "${f}" ]; then cp "${f}" .crates/subset.ndjson.gz; echo "path=.crates/subset.ndjson.gz" >> "$GITHUB_OUTPUT"; echo "crates subset from run ${id}: ${f##*/}"; break; fi
          done
          if [ ! -f .crates/subset.ndjson.gz ]; then echo "::warning title=history-popularity::No crates subset found in the last 10 successful history-packages runs; crates are not counted this run."; fi
      - name: Capture popularity
        if: steps.guard.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          CRATES_SUBSET: ${{ steps.crates.outputs.path }}
        run: |
          args=()
          if [ -n "${CRATES_SUBSET}" ]; then args=(--crates-subset "${CRATES_SUBSET}"); fi
          node history/popularity/run.mjs --out out/popularity --state .state/popularity --seed history/seed.txt --mode "${MODE}" "${args[@]}"
      - name: Save ETag cache
        if: steps.guard.outputs.proceed == 'true' && always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/popularity
          key: h3-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attest manifests
        if: steps.guard.outputs.proceed == 'true' && always()
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/popularity/manifest-*.json
      - name: Upload
        if: steps.guard.outputs.proceed == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: history-popularity-${{ github.run_id }}
          path: out/popularity/
          retention-days: 30
          if-no-files-found: ignore
