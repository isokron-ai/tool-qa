name: history-packages

on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: history-packages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
    steps:
      - name: Kill switch
        id: guard
        run: |
          if [ "${LOOP_ENABLED}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LOOP_ENABLED is not 'true'; history-packages did nothing."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: '22'
      - name: Restore feed positions
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/packages
          key: h2-state-none
          restore-keys: h2-state-
      - name: Unit tests
        if: steps.guard.outputs.go == 'true'
        run: node --test history/packages/test/
      - name: Capture package feeds
        id: capture
        if: steps.guard.outputs.go == 'true'
        run: node history/packages/run.mjs --out out/packages --state .state/packages
      - name: Save feed positions
        if: steps.guard.outputs.go == 'true' && always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/packages
          key: h2-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attest manifests
        if: steps.guard.outputs.go == 'true' && always()
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/packages/manifest-*.json
      - name: Upload
        if: steps.guard.outputs.go == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: history-packages-${{ github.run_id }}
          path: out/packages/
          retention-days: 30
          if-no-files-found: ignore
