name: lint

on:
  push:
    branches: [main]
  pull_request:
  # The ledger workflow dispatches this on ledger/refresh: its pull request is
  # opened with the job token, which starts no pull_request workflows.
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    permissions:
      contents: read
    # actionlint 1.7.12 does not accept the newer "$/" self-repository form yet,
    # so this stays workspace-relative until it does.
    uses: ./.github/workflows/lint-workflows.yml # zizmor: ignore[self-repository]
