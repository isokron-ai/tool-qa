name: lint

on:
  push:
    branches: [main]
  pull_request:
  # The ledger workflow dispatches this on ledger/refresh: its pull request is
  # opened with the job token, which starts no pull_request workflows. A
  # dispatched run reports through a commit status (job report).
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    permissions:
      contents: read
    # actionlint 1.7.12 does not accept the newer "$/" self-repository form yet,
    # so this stays workspace-relative until it does.
    uses: ./.github/workflows/lint-workflows.yml # zizmor: ignore[self-repository]

  # A dispatched run's check runs do not show on a pull request (checked on
  # pull request 22), so a dispatched run reports its result as a commit
  # status, which does (R-LED-10). The ledger workflow sets it to pending
  # before it dispatches. This job checks out nothing and runs no repo code.
  report:
    name: report the dispatched result
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Commit status dispatched/lint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.workflows.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/${REPO}/statuses/${SHA}" -f state="$state" -f context="dispatched/lint" \
            -f description="actionlint, zizmor, policy: ${RESULT}" -f target_url="$RUN_URL" --silent
