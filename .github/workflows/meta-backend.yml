# Loop worker (internal): the meta-backend lane. The tool-qa pump dispatches it with shard_id, attempt_id and
# items (docs/INTERFACES.md, "Worker dispatch"); each item is a public GitHub repository, owner/name.
# meta/run.mjs reads each repository's source archive from codeload.github.com (root files from
# raw.githubusercontent.com when the archive is over our caps) and classifies what its write tools write to:
# local_full, mock_min or none (field write_backend; docs/INTERFACES.md, "Writecheck modes"). The archive is
# read in memory with our own tar reader as text; nothing from it is installed, imported or run, so no sandbox
# is needed. The worker kit seals one bundle per item to the ingest key and uploads it as
# result-<attempt_id>-<i>.tar.age. meta/README.md says what a bundle holds.
#
# Security: workflow_dispatch only, from main; permissions: {} at the top and contents: read for the job.
# No secrets. The inputs reach steps through env: only and are checked whole before anything is read. The
# kill switch (LOOP_ENABLED first, then scripts/guard.mjs: LOOP_PAUSE_UNTIL and the lane switch) stops the lane
# without failing a run. Actions are pinned by full SHA. Controls run before any subject is read; if one
# fails, nothing is uploaded.
# No GitHub API is called; the job token is not passed to the script.
#
# Generated by meta/gen-workflows.mjs: edit that file, not this one.

name: meta-backend

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: Shard id from the tool-qa pump, such as meta-backend-3f2a9c01b7d4.
        required: true
        type: string
      attempt_id:
        description: Attempt id from the tool-qa pump; every result quotes it.
        required: true
        type: string
      items:
        description: 'JSON list of 1 to 50 {"subject": "owner/name", "run_key": "<64 hex>", "fence": <n>}.'
        required: true
        type: string

run-name: shard ${{ inputs.shard_id }}

permissions: {}

concurrency:
  group: meta-backend-${{ inputs.shard_id }}
  cancel-in-progress: false

jobs:
  collect:
    name: meta-backend
    if: github.repository == 'isokron-ai/tool-qa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Below the pump's lease for a shard of 50: 1.5 x (2 + 50 x 0.4) + 10 = 43 minutes. meta/run.mjs starts
    # no subject after 22 minutes; those not started report a retryable skip. A subject starts no request
    # after 150 seconds, and its archive has 90.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # First, before anything is checked out: LOOP_ENABLED must be exactly "true". Off is a notice, not a failure.
      - id: enabled
        name: Kill switch (LOOP_ENABLED)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
        run: |
          if [[ "$LOOP_ENABLED" == "true" ]]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=meta-backend::LOOP_ENABLED is not \"true\"; the loop is off and nothing is read"; fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: guard
        if: steps.enabled.outputs.on == 'true'
        name: Kill switch (LOOP_PAUSE_UNTIL, LANE_META_BACKEND_ENABLED)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_META_BACKEND_ENABLED: ${{ vars.LANE_META_BACKEND_ENABLED }}
        run: node scripts/guard.mjs --job meta-backend --no-slots
      - name: Check the inputs
        if: steps.guard.outputs.proceed == 'true'
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
        run: |
          # Whole-string checks: a newline or control character anywhere fails the match. meta/run.mjs checks
          # the items in full (JSON, 1 to 50 entries, run_key, fence) before anything is read.
          id_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          items_re='^\[[^[:cntrl:]]+\]$'
          if [[ ! "$SHARD_ID" =~ $id_re ]]; then echo "::error::shard_id is malformed"; exit 1; fi
          if [[ ! "$ATTEMPT_ID" =~ $id_re ]]; then echo "::error::attempt_id is malformed"; exit 1; fi
          if [[ ! "$ITEMS" =~ $items_re ]] || [ "${#ITEMS}" -gt 60000 ]; then echo "::error::items must be one line of JSON, a list of at most 60000 characters"; exit 1; fi
      - if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # The conditional-request cache: ETags and the summaries read with them, no response bodies.
      - if: steps.guard.outputs.proceed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/meta-cache/meta-backend.json
          key: meta-backend-http-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: meta-backend-http-v1-
      - id: collect
        if: steps.guard.outputs.proceed == 'true'
        name: Read the subjects
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
          META_CACHE_FILE: ${{ runner.temp }}/meta-cache/meta-backend.json
        run: |
          mkdir -p "$RUNNER_TEMP/meta-cache"
          node meta/run.mjs meta-backend "$RUNNER_TEMP/meta-out"
      - if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/meta-cache/meta-backend.json
          key: meta-backend-http-v1-${{ github.run_id }}-${{ github.run_attempt }}
