name: chaos-soak

# The long randomized chaos soak (chaos/soak.mjs): many seeded random fault
# schedules played against the whole loop (pump, ingest, successor, watchdog,
# snapshots, restores) on a simulated GitHub, each followed by a quiet spell in
# which the loop must recover on its own. It runs the shipped code against an
# in-memory GitHub only: no network calls, no secrets, nothing touches the
# live loop or its state. A failing seed is printed with its schedule; rerun it
# locally with `node chaos/soak.mjs --seed <n> --verbose`.
#
# Weekly, with seeds that move on every run, and on demand.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      seeds:
        description: How many seeds to play
        required: false
        default: '300'
      from:
        description: First seed (empty for one picked from the run number)
        required: false
        default: ''
      faults:
        description: Faults per schedule
        required: false
        default: '20'

permissions: {}

concurrency:
  group: chaos-soak
  cancel-in-progress: false

jobs:
  soak:
    name: chaos soak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Soak
        env:
          SEEDS: ${{ inputs.seeds }}
          FROM: ${{ inputs.from }}
          FAULTS: ${{ inputs.faults }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          seeds="${SEEDS:-300}"
          faults="${FAULTS:-20}"
          from="${FROM:-}"
          if [[ -z "$from" ]]; then from=$(( RUN_NUMBER * 1000 )); fi
          for v in "$seeds" "$faults" "$from"; do
            if [[ ! "$v" =~ ^[0-9]{1,7}$ ]]; then
              echo "::error::seeds, from and faults must be whole numbers"
              exit 2
            fi
          done
          status=0
          node chaos/soak.mjs --seeds "$seeds" --from "$from" --faults "$faults" > "$RUNNER_TEMP/soak.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/soak.txt"
          {
            echo '### Chaos soak'
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/soak.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
