name: perf-baselines

# Performance baselines for OUR OWN servers (docs/PERFORMANCE.md). Each release
# of kronicle-lite, sea-lite, mcp-check's server and tiny-tracker is installed
# from npm, loaded with the pinned Inspector CLI (`--load`: 8 concurrent calls
# over stdio, 8 sessions over loopback HTTP, then session churn), three repeats,
# and compared with the SAME server's previous release. Amber is a warning; red
# fails the job. Nothing else is ever measured: no third-party server, nothing
# remote, no model call, no secret.
#
# Runs on the runner directly, not in the gVisor sandbox: these are our own
# trusted servers, and a sandbox would add syscall cost to the very numbers
# being compared. The sandbox (mcp-surface-corpus) stays for third-party code.
#
# Weekly (it measures a server only when its latest release has no baseline
# yet) and on demand. The result of each run is an artifact; to keep it as the
# baseline for the next release, commit it as perf/baselines/<server>/<version>.json.

on:
  # A pull request that changes the harness measures the current releases once
  # (as a forced run), so the harness is exercised end to end before it merges.
  pull_request:
    paths:
      - 'perf/**'
      - 'scripts/guard.mjs'
      - '.github/workflows/perf-baselines.yml'
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:
    inputs:
      server:
        description: '"all" or one server id from perf/servers.json'
        required: false
        default: all
      version:
        description: Exact release to measure (one server only; empty is the latest on npm)
        required: false
        default: ''
      force:
        description: Measure even if that release already has a baseline
        required: false
        default: 'false'
      duration:
        description: Measured seconds per repeat
        required: false
        default: '20'
      repeats:
        description: Repeats per profile (medians are compared)
        required: false
        default: '3'

permissions: {}

concurrency:
  group: perf-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_PERF_ENABLED: ${{ vars.LANE_PERF_ENABLED }}
        run: node scripts/guard.mjs --job perf --no-slots
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Plan
        id: plan
        if: steps.guard.outputs.proceed == 'true'
        env:
          PERF_SERVER: ${{ inputs.server }}
          PERF_VERSION: ${{ inputs.version }}
          PERF_FORCE: ${{ inputs.force || (github.event_name == 'pull_request' && 'true') || 'false' }}
        run: node perf/plan.mjs

  measure:
    name: ${{ matrix.server }} ${{ matrix.version }}
    needs: [plan]
    if: ${{ needs.plan.outputs.proceed == 'true' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The Inspector, at the exact version and integrity in perf/package-lock.json, with no install scripts.
      - name: Install the pinned Inspector
        run: npm ci --prefix perf --ignore-scripts --no-audit --no-fund
      # The control first: the same harness against the fixture server, fast and slowed by 20 ms. If it cannot
      # see the slowdown, nothing below is worth recording.
      - name: Control (the harness must see a 20 ms slowdown)
        env:
          PERF_REQUIRE: '1'
        run: node --test test/perf-harness.test.mjs
      - name: Install the server release
        env:
          PKG: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          REBUILD: ${{ matrix.rebuild }}
        run: |
          set -euo pipefail
          # The plan job validated these; check again as whole strings before they reach a command.
          [[ "$PKG" =~ ^(@[a-z0-9][a-z0-9-]*/)?[a-z0-9][a-z0-9-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ -z "$REBUILD" || "$REBUILD" =~ ^[a-z0-9-]+( [a-z0-9-]+)*$ ]]
          mkdir -p "$RUNNER_TEMP/srv"
          npm install --prefix "$RUNNER_TEMP/srv" --ignore-scripts --no-audit --no-fund --no-save "$PKG@$VERSION"
          # Only the native add-on the server needs is built; no other install script runs.
          for dep in $REBUILD; do (cd "$RUNNER_TEMP/srv" && npm rebuild "$dep"); done
      - name: Measure
        env:
          SERVER: ${{ matrix.server }}
          DURATION: ${{ inputs.duration || '20' }}
          REPEATS: ${{ inputs.repeats || '3' }}
        run: |
          set -euo pipefail
          [[ "$SERVER" =~ ^[a-z][a-z0-9-]{0,40}$ ]]
          [[ "$DURATION" =~ ^[0-9]{1,3}$ && "$REPEATS" =~ ^[0-9]{1,2}$ ]]
          mkdir -p "$RUNNER_TEMP/out"
          node perf/run.mjs --server "$SERVER" --srv-dir "$RUNNER_TEMP/srv" --out "$RUNNER_TEMP/out/result.json" \
            --duration "$DURATION" --repeats "$REPEATS" --warmup 3 --concurrency 8
      - name: Compare with the previous release of the same server
        env:
          SERVER: ${{ matrix.server }}
        run: |
          set -euo pipefail
          node perf/compare.mjs --result "$RUNNER_TEMP/out/result.json" --summary "$GITHUB_STEP_SUMMARY" --verdict "$RUNNER_TEMP/out/verdict.json"
      - name: Name the baseline file
        if: ${{ !cancelled() }}
        env:
          SERVER: ${{ matrix.server }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/out/result.json" ]; then
            cp "$RUNNER_TEMP/out/result.json" "$RUNNER_TEMP/out/${SERVER}-${VERSION}.json"
            echo "To keep this run as the baseline, commit perf/baselines/${SERVER}/${VERSION}.json from the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.server }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/out/${{ matrix.server }}-${{ matrix.version }}.json
            ${{ runner.temp }}/out/verdict.json
          if-no-files-found: warn
          retention-days: 90
