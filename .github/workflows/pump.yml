name: pump

# The pump: works out what is due, sends shards to worker repositories within
# the slot budget, reaps expired leases and saves the state asset. Each run
# first dispatches the next one, which waits in the concurrency group, so the
# pump runs back to back while LOOP_SLOTS is above 0. The schedule restarts the
# chain if it breaks. With LOOP_SLOTS=0 a run only does housekeeping and does
# not dispatch a successor. See docs/OPERATIONS.md.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pump
  cancel-in-progress: false

jobs:
  pump:
    name: pump
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: loop
    permissions:
      contents: write # the state asset on the "state" release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_SLOTS: ${{ vars.LOOP_SLOTS }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_PUMP_ENABLED: ${{ vars.LANE_PUMP_ENABLED }}
        run: node scripts/guard.mjs --job pump
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Dispatch the next pump run
        if: steps.guard.outputs.proceed == 'true' && steps.guard.outputs.slots != '0'
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node pump/successor.mjs --out "$RUNNER_TEMP/successor.json"
      - name: Pump
        if: steps.guard.outputs.proceed == 'true'
        env:
          LOOP_SLOTS: ${{ steps.guard.outputs.slots }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_ID: ${{ vars.APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node pump/run.mjs --state "$RUNNER_TEMP/state/state.sqlite" --successor-result "$RUNNER_TEMP/successor.json"
