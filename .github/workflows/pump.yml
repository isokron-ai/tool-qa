name: pump

# The pump, the only writer of the loop state. Each tick it ingests finished
# worker runs (judges their results and records the decisions), works out what
# is due, sends shards to worker repositories within the slot budget, reaps
# expired leases and saves the state asset. Each run first dispatches the next
# one, which waits in the concurrency group, so the pump runs back to back while
# LOOP_SLOTS is above 0. The schedule restarts the chain if it breaks. With
# LOOP_SLOTS=0 a run only does housekeeping (ingest included) and does not
# dispatch a successor. The ingest outputs, age-encrypted to
# worker-kit/ingest.pub, are uploaded as one artifact per run. At the end of a
# run the pump prunes closed history out of the state: it stages the rows as
# one sealed archive (age-encrypted to state/state.pub), which is uploaded as
# its own artifact, and deletes them in a later run once that artifact reads
# back (pump/prune.mjs). It also dispatches the registry delta capture when
# the newest one is over 15 minutes old and none is queued or running
# (pump/registry-delta.mjs), because GitHub's */15 cron for it fires hours late.
# See docs/OPERATIONS.md.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pump
  cancel-in-progress: false

jobs:
  pump:
    name: pump
    runs-on: ubuntu-slim
    # The pump stops its ticks at 11 minutes; the rest covers set-up, the
    # successor's retries (90 s at most) and the final state push's retries.
    timeout-minutes: 20
    environment: loop
    permissions:
      contents: write # the state asset on the "state" release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_SLOTS: ${{ vars.LOOP_SLOTS }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_PUMP_ENABLED: ${{ vars.LANE_PUMP_ENABLED }}
        run: node scripts/guard.mjs --job pump
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Dispatch the next pump run
        if: steps.guard.outputs.proceed == 'true' && steps.guard.outputs.slots != '0'
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node pump/successor.mjs --out "$RUNNER_TEMP/successor.json"
      - name: Install age (pinned version, sha256 checked)
        if: steps.guard.outputs.proceed == 'true'
        run: bash worker-kit/install-age.sh "$RUNNER_TEMP/age"
      # AGE_IDENTITY is passed to this step only. The pump drops it from its
      # environment at start-up and scrubs it from every log line.
      - name: Pump
        if: steps.guard.outputs.proceed == 'true'
        env:
          LOOP_SLOTS: ${{ steps.guard.outputs.slots }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_ID: ${{ vars.APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          AGE_BIN: ${{ runner.temp }}/age/age
          AGE_KEYGEN_BIN: ${{ runner.temp }}/age/age-keygen
          LANE_STATE_PRUNE_ENABLED: ${{ vars.LANE_STATE_PRUNE_ENABLED }}
          # Sampling of `mode: sample` tier cells (pump/sampling.mjs). Unset means rate 0: nothing is sampled.
          SAMPLE_RATE_T1: ${{ vars.SAMPLE_RATE_T1 }}
          SAMPLE_RATE_T2: ${{ vars.SAMPLE_RATE_T2 }}
          SAMPLE_RATE_T3: ${{ vars.SAMPLE_RATE_T3 }}
          SAMPLE_RATE_T4: ${{ vars.SAMPLE_RATE_T4 }}
          SAMPLE_CAP_T1: ${{ vars.SAMPLE_CAP_T1 }}
          SAMPLE_CAP_T2: ${{ vars.SAMPLE_CAP_T2 }}
          SAMPLE_CAP_T3: ${{ vars.SAMPLE_CAP_T3 }}
          SAMPLE_CAP_T4: ${{ vars.SAMPLE_CAP_T4 }}
          LANE_HISTORY_REGISTRY_ENABLED: ${{ vars.LANE_HISTORY_REGISTRY_ENABLED }}
          LANE_SUBJECT_IDS_ENABLED: ${{ vars.LANE_SUBJECT_IDS_ENABLED }}
          # The discover lane (pump/discover.mjs): off unless the variable is exactly "true".
          LANE_DISCOVER_ENABLED: ${{ vars.LANE_DISCOVER_ENABLED }}
          # The backfill filler (pump/backfill.mjs): off unless the variable is exactly "true".
          LANE_BACKFILL_ENABLED: ${{ vars.LANE_BACKFILL_ENABLED }}
          # The head poll (pump/heads.mjs): off unless the variable is exactly "true".
          LANE_HEADS_ENABLED: ${{ vars.LANE_HEADS_ENABLED }}
          # The live loop view snapshot (live/publish.mjs): off unless the variable is exactly "true".
          LANE_LIVE_SNAPSHOT_ENABLED: ${{ vars.LANE_LIVE_SNAPSHOT_ENABLED }}
          # The lead pipeline (state/leads.mjs): off unless the variable is "dry-run", "recheck" or "true".
          LANE_LEADS_ENABLED: ${{ vars.LANE_LEADS_ENABLED }}
          # Shown by the live view's publish gate node (config.switches).
          RESULTS_PUBLISH_ENABLED: ${{ vars.RESULTS_PUBLISH_ENABLED }}
          LIVE_R2_ACCESS_KEY_ID: ${{ secrets.LIVE_R2_ACCESS_KEY_ID }}
          LIVE_R2_SECRET_ACCESS_KEY: ${{ secrets.LIVE_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          LIVE_R2_BUCKET: isokron-loop-live
        run: >-
          node pump/run.mjs --state "$RUNNER_TEMP/state/state.sqlite"
          --successor-result "$RUNNER_TEMP/successor.json"
          --ingest-out "$RUNNER_TEMP/ingest-out"
          --keep-out "$RUNNER_TEMP/keep-out"
          --state-archive-out "$RUNNER_TEMP/state-archive"
      # Sealed ingest outputs (ingest-<attempt>-<index>.tar.age), readable only with
      # AGE_IDENTITY. Uploaded even if the pump step failed, so outputs of
      # decisions it already pushed are kept.
      - name: Upload sealed ingest outputs (90 days)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingest-out/
          retention-days: 90
          if-no-files-found: ignore
      # The keep-forever part of the same outputs (keep-*.tar.age, catalog-*.tar.age),
      # each also zstd and age: results, manifests, observations, one tool list
      # per distinct catalog. The full bundles above are kept 30 days; this is
      # what the keep-forever copy (keep-forever.yml) and the archive keep for good.
      - name: Upload the keep-forever outputs (90 days)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-keep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keep-out/
          retention-days: 90
          if-no-files-found: ignore
      # Marks the runs whose keep-forever file could not be written for some item
      # (keep-gap-*.tar.age): the off-site prune then keeps that run's full bundles.
      - name: Upload the keep-forever gap markers (90 days)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-keepgap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keep-gap-out/
          retention-days: 90
          if-no-files-found: ignore
      # The state archive this run staged (state-archive-<run id>-<attempt>.tar.age,
      # readable only with AGE_IDENTITY): rows moved out of the live state.
      # A later pump run deletes them from the state only once it finds this
      # artifact on this run and reads it back. Its name starts with ingest-,
      # so the archive pull and the off-site backup keep it like the ingest
      # outputs.
      - name: Upload the staged state archive (90 days)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-state-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-archive/
          retention-days: 90
          if-no-files-found: ignore
