# Fixture run of the metadata lanes on every pull request that touches them: the real APIs, three of our own
# repositories, the same script and the same 100 worker-kit slots (the same pinned kit) as the workers, with the kit in dry-run mode
# (built and checked, never encrypted or uploaded). meta/fixture.mjs then judges every bundle with ingest's own
# checks against the pinned field registry, and the job fails unless each one is accepted.
#
# Security: pull_request only (no pull_request_target), permissions: {} at the top and contents: read for the
# job, no secrets; the job token reads public data. Actions are pinned by full SHA.
#
# Generated by meta/gen-workflows.mjs: edit that file, not this one.

name: meta-fixture

on:
  pull_request:
    paths:
      - 'meta/**'
      - 'worker-kit/**'
      - 'ingest/**'
      - '.github/workflows/meta-*.yml'

permissions: {}

concurrency:
  group: meta-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: fixture (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [meta-github, meta-registry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - id: items
        name: Fixture items
        env:
          LANE: ${{ matrix.lane }}
        run: node meta/fixture.mjs items "$LANE" >> "$GITHUB_OUTPUT"
      - id: collect
        name: Read the fixture subjects (real APIs)
        env:
          LANE: ${{ matrix.lane }}
          SHARD_ID: ${{ steps.items.outputs.shard_id }}
          ATTEMPT_ID: ${{ steps.items.outputs.attempt_id }}
          ITEMS: ${{ steps.items.outputs.items }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Whole-string checks: a newline or control character anywhere fails the match. meta/run.mjs checks
          # the items in full (JSON, 1 to 100 entries, run_key, fence) before anything is read.
          id_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          items_re='^\[[^[:cntrl:]]+\]$'
          if [[ ! "$SHARD_ID" =~ $id_re ]]; then echo "::error::shard_id is malformed"; exit 1; fi
          if [[ ! "$ATTEMPT_ID" =~ $id_re ]]; then echo "::error::attempt_id is malformed"; exit 1; fi
          if [[ ! "$ITEMS" =~ $items_re ]] || [ "${#ITEMS}" -gt 60000 ]; then echo "::error::items must be one line of JSON, a list of at most 60000 characters"; exit 1; fi
          node meta/run.mjs "$LANE" "$RUNNER_TEMP/meta-out"
      - name: Seal and check item 0
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.has_0 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # main at b1f25a9
        with:
          bundle-dir: ${{ runner.temp }}/meta-out/0/bundle
          meta-file: ${{ runner.temp }}/meta-out/0/meta.json
          attempt-id: ${{ steps.items.outputs.attempt_id }}
          item-index: '0'
          fence: ${{ steps.collect.outputs.fence_0 }}
          run-key: ${{ steps.collect.outputs.run_key_0 }}
          dry-run: 'true'
      - name: Seal and check item 1
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.has_1 == 'true' }}
