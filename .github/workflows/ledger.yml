# The cross-repo regression ledger: reads every tool repository's REGRESSIONS.md
# (scripts/ledger.mjs, sources in ledger/sources.json), regenerates
# ledger/ledger.json and docs/LEDGER.md, and opens or updates one pull request
# (branch ledger/refresh) when they change. It never merges.
#
# Token: the job's own GITHUB_TOKEN, with contents: write (push the refresh
# branch) and pull-requests: write (open or close its pull request). The API
# lookups (commits/{sha}/pulls, releases, compare) read public repositories.
# A pull request opened with GITHUB_TOKEN does not start other workflows, so
# this job runs the ledger's own tests before it writes anything.
#
# Kill switch: LOOP_ENABLED, LOOP_PAUSE_UNTIL and LANE_LEDGER_ENABLED, through
# scripts/guard.mjs, before anything else runs.
name: ledger

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_LEDGER_ENABLED: ${{ vars.LANE_LEDGER_ENABLED }}
        run: node scripts/guard.mjs --job ledger --no-slots
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Ledger tests
        if: steps.guard.outputs.proceed == 'true'
        run: node --test test/ledger.test.mjs
      - name: Regenerate the ledger
        if: steps.guard.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_API_BUDGET: '300'
        run: node scripts/ledger.mjs
      - name: Open or update the pull request
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ledger/refresh
        run: |
          open_pr="$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$(git status --porcelain -- ledger docs/LEDGER.md)" ]; then
            echo "::notice::The ledger on main is up to date."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" -R "$REPO" --delete-branch --comment "main already has this ledger; closing."
            fi
            exit 0
          fi
          git switch -C "$BRANCH"
          git add -- ledger docs/LEDGER.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Ledger: refresh from the tool repositories' REGRESSIONS.md"
          git -c credential.helper= -c credential.helper='!gh auth git-credential' push --force -q "https://github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "## Ledger"
            git show --stat --format= HEAD
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$open_pr" ]; then
            echo "::notice::Updated pull request #${open_pr}."
          else
            gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "Ledger: refresh" \
              --body "Regenerated by the ledger workflow (scripts/ledger.mjs) from each tool repository's REGRESSIONS.md on main. Review docs/LEDGER.md, then merge by hand. This pull request was opened with the workflow token, so test.yml does not run on it; the workflow ran test/ledger.test.mjs before writing."
          fi
