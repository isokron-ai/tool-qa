# The cross-repo regression ledger: reads every tool repository's REGRESSIONS.md
# (scripts/ledger.mjs, sources in ledger/sources.json), regenerates
# ledger/ledger.json and docs/LEDGER.md, and opens or updates one pull request
# (branch ledger/refresh) when they change. It never merges.
#
# Two jobs (R-LED-05):
#   generate  read-only token. Runs the ledger tests, regenerates the files and
#             uploads them as an artifact. If a source's ledger cannot be read
#             it still writes the rest, uploads them for a look, and fails, so
#             no pull request is made from a partial ledger.
#   publish   runs no ledger code: it copies the three generated files into
#             place and publishes them. Only a pull request from this
#             repository counts as its own (scripts/ledger-own-pr.mjs,
#             R-LED-02), not a fork's branch of the same name.
#             contents: write       build the commit through the API and move
#                                   the refresh branch
#             pull-requests: write  open or close its pull request
#             actions: write        dispatch test.yml and lint.yml on the
#                                   refresh branch
#             statuses: write       set their commit statuses to pending
#
# The commit is made through the git data API (a tree, then a commit, then the
# ref), never with `git commit` and a push, so GitHub signs it and it shows as
# verified (R-LED-08). The job checks that the API tree is the one it generated
# locally, and that the new commit is verified before it moves the branch. If
# the branch already holds the same tree on the same main commit, verified, it
# makes no new commit.
#
# A pull request opened with the job token starts no pull_request workflows, so
# after a new commit the job dispatches test.yml and lint.yml on ledger/refresh
# (workflow_dispatch is the one event the job token may start). The check runs
# of a dispatched run do not show on a pull request (checked on pull request
# 22), but commit statuses do: the job sets dispatched/test and dispatched/lint
# to pending on the new commit, and each dispatched run's report job sets its
# own to success or failure when it ends (R-LED-09). A dispatch that never runs
# leaves its status pending, so the pull request cannot pass by default.
#
# Kill switch: LOOP_ENABLED, LOOP_PAUSE_UNTIL and LANE_LEDGER_ENABLED, through
# scripts/guard.mjs, first in each job.
name: ledger

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_LEDGER_ENABLED: ${{ vars.LANE_LEDGER_ENABLED }}
        run: node scripts/guard.mjs --job ledger --no-slots
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Ledger tests
        if: steps.guard.outputs.proceed == 'true'
        run: node --test test/ledger.test.mjs
      - name: Regenerate the ledger
        id: regen
        if: steps.guard.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_API_BUDGET: '300'
        run: node scripts/ledger.mjs
      - name: Upload the generated files
        if: always() && steps.regen.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ledger/ledger.json
            ledger/cache.json
            docs/LEDGER.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    if: needs.generate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kill switch
        id: guard
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_LEDGER_ENABLED: ${{ vars.LANE_LEDGER_ENABLED }}
        run: node scripts/guard.mjs --job ledger --no-slots
      - name: Download the generated files
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledger-out
      - name: Put them in place
        if: steps.guard.outputs.proceed == 'true'
        env:
          OUT: ${{ runner.temp }}/ledger-out
        run: |
          for f in ledger/ledger.json ledger/cache.json docs/LEDGER.md; do
            if [ ! -f "$OUT/$f" ] || [ -L "$OUT/$f" ]; then echo "::error::$f is missing from the artifact"; exit 1; fi
            cp "$OUT/$f" "$f"
          done
      - name: Open or update the pull request
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ledger/refresh
        run: |
          set -euo pipefail
          open_pr="$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,isCrossRepository,headRepositoryOwner | node scripts/ledger-own-pr.mjs "$OWNER")"
          if [ -z "$(git status --porcelain -- ledger docs/LEDGER.md)" ]; then
            echo "::notice::The ledger on main is up to date."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" -R "$REPO" --delete-branch --comment "main already has this ledger; closing."
            fi
            exit 0
          fi

          # The tree we mean to publish, computed locally: main plus the three files.
          base="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse "${base}^{tree}")"
          git add -- ledger docs/LEDGER.md
          tree="$(git write-tree)"
          {
            echo "## Ledger"
            git diff --cached --stat "$base"
          } >> "$GITHUB_STEP_SUMMARY"

          # Where the refresh branch stands now (empty if it does not exist).
          cur="$(gh api "repos/${REPO}/git/matching-refs/heads/${BRANCH}" --jq ".[] | select(.ref == \"refs/heads/${BRANCH}\") | .object.sha")"
          if [ -n "$cur" ]; then
            cur_state="$(gh api "repos/${REPO}/git/commits/${cur}" --jq '[.tree.sha, (.parents | map(.sha) | join(",")), (.verification.verified | tostring)] | join(" ")')"
          else
            cur_state=""
          fi

          new=""
          if [ "$cur_state" = "$tree $base true" ]; then
            echo "::notice::${BRANCH} already holds this ledger on ${base} as a verified commit; no new commit."
          else
            # R-LED-08: tree, commit and ref through the API, so GitHub signs the commit.
            api_tree="$(jq -n --arg base_tree "$base_tree" \
                --rawfile l ledger/ledger.json --rawfile c ledger/cache.json --rawfile m docs/LEDGER.md \
                '{base_tree: $base_tree, tree: [
                   {path: "ledger/ledger.json", mode: "100644", type: "blob", content: $l},
                   {path: "ledger/cache.json",  mode: "100644", type: "blob", content: $c},
                   {path: "docs/LEDGER.md",     mode: "100644", type: "blob", content: $m}]}' \
              | gh api -X POST "repos/${REPO}/git/trees" --input - --jq .sha)"
            if [ "$api_tree" != "$tree" ]; then
              echo "::error::The tree built through the API (${api_tree}) is not the one generated here (${tree}); nothing published."
              exit 1
            fi
            made="$(jq -n --arg tree "$tree" --arg parent "$base" \
                --arg message "Ledger: refresh from the tool repositories' REGRESSIONS.md" \
                '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api -X POST "repos/${REPO}/git/commits" --input - --jq '[.sha, (.verification.verified | tostring)] | join(" ")')"
            new="${made%% *}"
            verified="${made#* }"
            if [ "$verified" != true ]; then
              verified="$(gh api "repos/${REPO}/git/commits/${new}" --jq '.verification.verified | tostring')"
            fi
            if [ "$verified" != true ]; then
              echo "::error::Commit ${new} is not verified; ${BRANCH} is left as it was."
              exit 1
            fi
            if [ -n "$cur" ]; then
              gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="$new" -F force=true --silent
            else
              gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$new" --silent
            fi
            echo "::notice::${BRANCH} is now ${new} (verified)."
          fi

          if [ -n "$open_pr" ]; then
            echo "::notice::Updated pull request #${open_pr}."
          else
            gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "Ledger: refresh" \
              --body "Regenerated by the ledger workflow (scripts/ledger.mjs) from each tool repository's REGRESSIONS.md on main. Review docs/LEDGER.md, then merge by hand. The commit was made through the API, so GitHub signed it. A pull request opened with the workflow token starts no pull_request workflows, so the workflow dispatches test.yml and lint.yml on this branch after each new commit; their results show here as the commit statuses dispatched/test and dispatched/lint."
          fi

          # R-LED-09: the checks this pull request would otherwise not get. Pending first, so a
          # dispatched run's own result can never be overwritten by it.
          if [ -n "$new" ]; then
            for wf in test lint; do
              gh api -X POST "repos/${REPO}/statuses/${new}" -f state=pending -f context="dispatched/${wf}" \
                -f description="${wf}.yml dispatched on ${BRANCH}" --silent
            done
            for wf in test.yml lint.yml; do
              gh workflow run "$wf" -R "$REPO" --ref "$BRANCH"
            done
            echo "::notice::Dispatched test.yml and lint.yml on ${BRANCH} at ${new}."
          fi
