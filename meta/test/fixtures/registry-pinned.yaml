  # The live tool list as one: how many tools, and its hash (the checker engine's catalog hash, sha256 of the
  # canonical JSON of the list). Per-tool fields cannot give either. Written by the live-probe lane of mcp-check.
  # tool_list_sha256 is not catalog_snapshot_id. tool_list_sha256 is measured by the worker: the checker engine's
  # hash of the tools alone, as the engine reads them (each tool's definition, canonical JSON), so two servers or two
  # runs with the same tools have the same value whatever else they answer. catalog_snapshot_id (longitudinal) is
  # set by ingest: the content address of a stored snapshot, sha256 of the JCS of the initialize answer together with
  # the tools/list answer, so it changes when serverInfo, capabilities or instructions change though the tools do not.
  - {id: tool_count, layer: protocol, type: integer, unit: count, source: scan-live, class: P, redaction: null, status: active}
