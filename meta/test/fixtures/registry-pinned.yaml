# Field registry, version 0.
#
# One entry per field that the tool-qa loop captures, or plans to capture,
# about an MCP server. Nothing here is published yet. The catalogue follows the
# capture plan; fields are not added here unless the plan has them.
#
# Entry keys
#   id         snake_case name of the field
#   layer      which part of the capture the field belongs to
#   type       string | integer | number | boolean | enum | array | object
#              | timestamp | hash (a sha256 hex digest)
#   unit       ms, bytes, tokens, count, ratio, percent, lines, chars, days,
#              or "none"
#   source     the workflow or collector that produces the field
#   class      publish class, explained below
#   redaction  null, or a list of redaction rule ids (R1 to R4) applied before
#              the value is stored
#   status     planned: not emitted by any merged worker code or by ingest yet
#              active: emitted by merged worker code (scan-static, live-probe,
#                meta-github, meta-registry) or set by tool-qa ingest. The lane
#                may be disabled: which lanes the live loop runs is in tool-qa
#                pump/workflows.json (`enabled`), not here, so "active" does
#                not mean collected today
#              deprecated: no longer emitted; ingest refuses it
#
# Publish classes, in plain words
#   P    Public for each server, automatically, once the release checks and the
#        canary checks pass. These are our own measurements.
#   P-s  Public for each server, labelled "read from source": taken from the
#        code, not from running it.
#   P-h  Public for each server only after a person has checked it. These are
#        heuristic claims about behaviour. Published as "pattern present",
#        never as a verdict.
#   P-t  Text written by the upstream author (descriptions, instructions,
#        schemas with descriptive text). Published word for word only when the
#        upstream licence allows redistribution. Otherwise only a hash, a
#        length, token counts and derived features are public, and the text
#        stays private.
#   PA   Public only as aggregates (counts, distributions, cells of at least
#        five). The per-server value stays private. Counts never include
#        class S items until their disclosure window has ended.
#   B    A behaviour verdict, including hardening findings and tool issues
#        (for example a read-only tool that can write). Public for each server,
#        by company and repo name, once a person has confirmed it. Publication
#        never waits for an upstream issue or pull request.
#   S    An actual security issue (an exploitable vulnerability). Private until
#        its coordinated-disclosure window ends, and not shown in any form
#        before then, counts included. Hardening findings are B, not S.
#   M    Evidence of malicious behaviour. Reported to the registry first.
#   X    Private for good: raw transcripts, anything that may hold a secret or
#        personal data, and data under a licence that forbids redistribution.
#
# Redaction rules
#   R1  Text written by the target's author. Scanned for secrets; only the
#       matching span is masked.
#   R2  Anything that can carry a credential (env values, stderr, headers, URLs
#       with query strings). Public data keeps only a hash and a length.
#   R3  Personal data (logins, names, emails). Emails are never stored. Public
#       output is aggregates only.
#   R4  Dummy canary values we inject. Every output is searched for them.
#
# A field can appear as text and as a hash of that text, in two entries,
# because the two have different classes.

version: 0
